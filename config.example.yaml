listen: ":1161"
community: "public"
poll: 30s

switch:
  url: "http://192.0.2.10"
  password: "changeme"
  ports: 8
  poe_budget_watts: 62

# Optional SNMPv3 (leave username empty to disable)
snmpv3:
  username: ""
  auth_pass: ""
  priv_pass: ""
  auth_proto: SHA
  priv_proto: AES

traps:
  enabled: false
  targets:
    - "192.0.2.20:162"

sys:
  name: "switch-1"
  contact: "ops@example.com"
  location: "lab"

