version: 2

project_name: snare

before:
  hooks:
    - go mod tidy

builds:
  - id: snare
    main: ./cmd/snare
    binary: snare
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  name_template: "snare-{{.Version}}"
  mode: keep-existing

dockers_v2:
  - images:
      - ghcr.io/kgrubb/snare
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.source": "https://github.com/kgrubb/snare"
      "org.opencontainers.image.licenses": "AGPL-3.0-only"
    extra_files:
      - config.example.yaml
