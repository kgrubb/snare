version: 2

project_name: snare

before:
  hooks:
    - go mod tidy

builds:
  - id: snare
    main: ./cmd/snare
    binary: snare
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  name_template: "snare-{{.Version}}"
  mode: keep-existing

dockers:
  - image_templates:
      - "ghcr.io/kgrubb/snare:{{ .Version }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/kgrubb/snare"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-only"
    extra_files:
      - config.example.yaml

  - image_templates:
      - "ghcr.io/kgrubb/snare:{{ .Version }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/kgrubb/snare"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-only"
    extra_files:
      - config.example.yaml

docker_manifests:
  - name_template: "ghcr.io/kgrubb/snare:{{ .Version }}"
    image_templates:
      - "ghcr.io/kgrubb/snare:{{ .Version }}-amd64"
      - "ghcr.io/kgrubb/snare:{{ .Version }}-arm64"
  - name_template: "ghcr.io/kgrubb/snare:latest"
    image_templates:
      - "ghcr.io/kgrubb/snare:{{ .Version }}-amd64"
      - "ghcr.io/kgrubb/snare:{{ .Version }}-arm64"
