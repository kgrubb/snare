name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  pages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PAT/App token so the release PR is not authored by github-actions[bot].
          # Bot-authored PRs need a maintainer click to run CI on every update.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Same gate as goreleaser: only when release-please cuts a release.
  # Chart version tracks the app via release-please extra-files.
  chart:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@v5

      - name: Import GPG key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "GPG_PRIVATE_KEY not set. Publishing unsigned charts."
            exit 0
          fi
          gpg_dir="$RUNNER_TEMP/gpg"
          mkdir -p "$gpg_dir"
          chmod 700 "$gpg_dir"
          export GNUPGHOME="$gpg_dir"
          echo "GNUPGHOME=$gpg_dir" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long
          gpg --list-secret-keys --keyid-format long | grep -q "CA999A73395F45FD"
          gpg --export-secret-keys AFB495384FDAD4EDC0EBF8FECA999A73395F45FD > "$gpg_dir/secring.gpg"
          test -s "$gpg_dir/secring.gpg"
          printf '\n' > "$gpg_dir/passphrase"
          echo "CR_KEYRING=$gpg_dir/secring.gpg" >> "$GITHUB_ENV"
          echo "CR_PASSPHRASE_FILE=$gpg_dir/passphrase" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Package ourselves so chart-releaser does not rely on "changed since tag"
      # (release-please just tagged this commit, so change detection is empty).
      - name: Package chart
        env:
          SIGNED: ${{ steps.gpg.outputs.signed }}
          CR_KEY: 8471701+kgrubb@users.noreply.github.com
        run: |
          mkdir -p .cr-release-packages
          args=(charts/snare -d .cr-release-packages)
          if [[ "${SIGNED}" == "true" ]]; then
            args+=(--sign --key "$CR_KEY" --keyring "$CR_KEYRING" --passphrase-file "$CR_PASSPHRASE_FILE")
          fi
          helm package "${args[@]}"

      - name: Publish charts
        # v1.8.0 fixes unbound latest_tag when skip_packaging is set.
        uses: helm/chart-releaser-action@v1.8.0
        with:
          charts_dir: charts
          config: cr.yaml
          skip_packaging: true
          skip_existing: true
          packages_with_index: true
          # App tag vX.Y.Z stays GitHub Latest. Chart tag is snare-X.Y.Z.
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GNUPGHOME: ${{ env.GNUPGHOME }}
          CR_SIGN: ${{ steps.gpg.outputs.signed }}
          CR_KEY: 8471701+kgrubb@users.noreply.github.com
          CR_KEYRING: ${{ env.CR_KEYRING }}
          CR_PASSPHRASE_FILE: ${{ env.CR_PASSPHRASE_FILE }}

      - name: Sync gh-pages assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sync-gh-pages.sh
          ./scripts/sync-gh-pages.sh
