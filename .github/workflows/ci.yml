name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Test
        run: |
          go test ./internal/... -race -count=1 -coverprofile=coverage.out -covermode=atomic
          go test ./cmd/... -count=1

      - name: Coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "coverage=${total}%"
          awk -v t="$total" 'BEGIN { if ((t+0) < 85) { print "coverage " t "% is below 85%"; exit 1 } }'

      - name: Build
        run: go build -o /tmp/snare ./cmd/snare

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint YAML
        run: |
          pipx install yamllint
          yamllint .

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Lint chart
        run: helm lint charts/snare --strict -f ci/values.yaml

      - name: Render chart
        run: |
          helm template test charts/snare -f ci/values.yaml
          helm template test charts/snare -f ci/values.yaml \
            --set existingSecret=snare-config \
            --set config.switch.url= \
            --set config.switch.password= \
            --set service.type=ClusterIP \
            --set 'resources.requests.memory=64Mi'

      - name: Lint manifests
        uses: stackrox/kube-linter-action@v1
        with:
          directory: charts/snare
          config: .kube-linter.yaml
