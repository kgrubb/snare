name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go badge
        run: |
          ver=$(awk '/^go /{print $2; exit}' go.mod)
          curl -fsSL "https://img.shields.io/badge/go-${ver}-00ADD8.svg" -o /tmp/go.svg
          diff -q /tmp/go.svg badges/go.svg

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Test
        run: |
          go test ./internal/... -race -count=1 -coverprofile=coverage.out -covermode=atomic
          go test ./cmd/... -count=1

      - name: Coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "coverage=${total}%"
          awk -v t="$total" 'BEGIN { if ((t+0) < 85) { print "coverage " t "% is below 85%"; exit 1 } }'

      - name: Build
        run: go build -o /tmp/snare ./cmd/snare
