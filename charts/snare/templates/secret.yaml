{{- if and .Values.existingSecret (or (ne (.Values.config.switch.url | default "") "") (ne (.Values.config.switch.password | default "") "")) }}
{{- fail "existingSecret is mutually exclusive with config.switch.url/password" }}
{{- end }}
{{- if eq (include "snare.createSecret" .) "true" }}
{{- if or (empty .Values.config.switch.url) (empty .Values.config.switch.password) }}
{{- fail "set existingSecret, or provide config.switch.url and config.switch.password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snare.secretName" . }}
  labels:
    {{- include "snare.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    listen: {{ printf ":%v" .Values.service.targetPort | quote }}
    community: {{ .Values.config.community | quote }}
    poll: {{ .Values.config.poll | quote }}
    switch:
      url: {{ .Values.config.switch.url | quote }}
      password: {{ .Values.config.switch.password | quote }}
      ports: {{ .Values.config.switch.ports }}
      poe_budget_watts: {{ .Values.config.switch.poe_budget_watts }}
    snmpv3:
      username: {{ .Values.config.snmpv3.username | quote }}
      auth_pass: {{ .Values.config.snmpv3.auth_pass | quote }}
      priv_pass: {{ .Values.config.snmpv3.priv_pass | quote }}
      auth_proto: {{ .Values.config.snmpv3.auth_proto }}
      priv_proto: {{ .Values.config.snmpv3.priv_proto }}
    traps:
      enabled: {{ .Values.config.traps.enabled }}
      targets:
        {{- if .Values.config.traps.targets }}
        {{- toYaml .Values.config.traps.targets | nindent 8 }}
        {{- else }}
        []
        {{- end }}
    sys:
      name: {{ .Values.config.sys.name | quote }}
      contact: {{ .Values.config.sys.contact | quote }}
      location: {{ .Values.config.sys.location | quote }}
{{- end }}
