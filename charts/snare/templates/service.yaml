apiVersion: v1
kind: Service
metadata:
  name: {{ include "snare.fullname" . }}
  labels:
    {{- include "snare.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.externalTrafficPolicy (or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort")) }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "snare.selectorLabels" . | nindent 4 }}
  ports:
    - name: snmp
      port: {{ .Values.service.port }}
      targetPort: snmp
      protocol: UDP
