image:
  repository: ghcr.io/kgrubb/snare
  tag: 1.1.3
  digest: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
replicaCount: 1
strategy:
  type: Recreate
serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ''
service:
  type: LoadBalancer
  port: 161
  targetPort: 1161
  externalTrafficPolicy: Local
  annotations: {}
config:
  community: public
  poll: 30s
  switch:
    url: ''
    password: ''
    ports: 8
    poe_budget_watts: 62
  snmpv3:
    username: ''
    auth_pass: ''
    priv_pass: ''
    auth_proto: SHA
    priv_proto: AES
  traps:
    enabled: false
    targets: []
  sys:
    name: ''
    contact: ''
    location: ''
existingSecret: ''
resources: {}
podAnnotations: {}
podLabels: {}
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 65532
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
extraEnv: {}
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
